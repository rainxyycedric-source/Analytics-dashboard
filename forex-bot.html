<!DOCTYPE html>
<html>
<head>
    <title>XAUUSD Trading Bot</title>
    <style>
        body {font-family:Arial;background:#1a1a2e;color:#fff;padding:20px;max-width:1200px;margin:auto}
        .dashboard {display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-bottom:20px}
        .card {background:#16213e;padding:20px;border-radius:10px}
        .price {font-size:3em;font-weight:bold;color:#ffd700}
        .signal {padding:10px;border-radius:5px;font-weight:bold;margin:10px 0}
        .buy {background:#00ff88;color:#000}
        .sell {background:#ff4444;color:#fff}
        .hold {background:#444}
        button {background:#ffd700;color:#000;padding:15px 30px;border:none;border-radius:5px;font-size:16px;cursor:pointer;margin:5px}
        button:hover {background:#ffed4a}
        button:disabled {background:#666;cursor:not-allowed}
        .log {background:#0f3460;padding:15px;border-radius:10px;height:300px;overflow-y:auto;font-family:monospace;font-size:12px}
        .stats {display:flex;justify-content:space-around;margin:20px 0}
        .stat {text-align:center}
        .stat-value {font-size:2em;color:#ffd700}
    </style>
</head>
<body>
    <h1>🤖 XAUUSD Forex Trading Bot</h1>
    
    <div class="dashboard">
        <div class="card">
            <div>Current Price</div>
            <div class="price" id="price">$2,450.23</div>
            <div id="signal" class="signal hold">HOLD</div>
        </div>
        <div class="card">
            <div>Account Balance</div>
            <div class="stat-value" id="balance">$10,000</div>
            <div>Equity: <span id="equity">$10,000</span></div>
        </div>
        <div class="card">
            <div>Performance</div>
            <div class="stat-value" id="pnl">+0.00%</div>
            <div>Win Rate: <span id="winrate">0%</span></div>
        </div>
    </div>

    <div class="stats">
        <div class="stat">
            <div>Wins</div>
            <div class="stat-value" id="wins">0</div>
        </div>
        <div class="stat">
            <div>Losses</div>
            <div class="stat-value" id="losses">0</div>
        </div>
        <div class="stat">
            <div>Trades</div>
            <div class="stat-value" id="trades">0</div>
        </div>
    </div>

    <div style="text-align:center;margin:20px 0">
        <button onclick="startBot()">▶️ Start Bot</button>
        <button onclick="stopBot()">⏹️ Stop Bot</button>
        <button onclick="placeTrade('buy')">🟢 BUY</button>
        <button onclick="placeTrade('sell')">🔴 SELL</button>
        <button onclick="resetBot()">🔄 Reset</button>
    </div>

    <div class="card">
        <h3>📊 Trade Log</h3>
        <div id="log" class="log"></div>
    </div>

    <script>
        // Trading Bot State
        let botRunning = false;
        let balance = 10000;
        let equity = 10000;
        let position = null;
        let trades = 0;
        let wins = 0;
        let losses = 0;
        let priceHistory = [];
        let currentPrice = 2450.23;

        // Technical Indicators
        function calculateRSI(prices, period = 14) {
            let gains = 0, losses = 0;
            for (let i = 1; i < period && i < prices.length; i++) {
                const change = prices[i] - prices[i-1];
                if (change > 0) gains += change;
                else losses -= change;
            }
            const avgGain = gains / period;
            const avgLoss = losses / period;
            const rs = avgGain / avgLoss;
            return 100 - (100 / (1 + rs));
        }

        function calculateMA(prices, period) {
            const slice = prices.slice(-period);
            return slice.reduce((a, b) => a + b, 0) / period;
        }

        function generateSignal() {
            if (priceHistory.length < 20) return 'HOLD';
            
            const rsi = calculateRSI(priceHistory);
            const ma20 = calculateMA(priceHistory, 20);
            const ma50 = calculateMA(priceHistory, 50);
            
            // Trading Strategy: RSI + MA Crossover
            if (rsi < 30 && currentPrice > ma20) return 'BUY';
            if (rsi > 70 && currentPrice < ma20) return 'SELL';
            if (ma20 > ma50 && currentPrice > ma20) return 'BUY';
            if (ma20 < ma50 && currentPrice < ma20) return 'SELL';
            
            return 'HOLD';
        }

        function updatePrice() {
            // Simulate realistic XAUUSD price movement
            const volatility = 0.5 + Math.random() * 1.5;
            const direction = (Math.random() - 0.5) * 2;
            currentPrice += (direction * volatility * currentPrice / 10000);
            currentPrice = Math.max(2000, Math.min(3000, currentPrice));
            
            priceHistory.push(currentPrice);
            if (priceHistory.length > 100) priceHistory.shift();
            
            document.getElementById('price').textContent = `$${currentPrice.toFixed(2)}`;
            document.getElementById('signal').textContent = generateSignal();
            document.getElementById('signal').className = `signal ${generateSignal().toLowerCase()}`;
        }

        function executeTrade(signal) {
            if (!position) {
                position = {
                    type: signal,
                    entry: currentPrice,
                    size: 0.1, // 0.1 lot
                    timestamp: Date.now()
                };
                logTrade(`🟢 ${signal.toUpperCase()} @ $${currentPrice.toFixed(2)}`);
            } else {
                const pnl = signal === 'BUY' ? 
                    (currentPrice - position.entry) * 1000 * position.size :
                    (position.entry - currentPrice) * 1000 * position.size;
                
                balance += pnl;
                equity = balance;
                
                if (pnl > 0) wins++;
                else losses++;
                trades++;
                
                logTrade(`🔒 CLOSE ${position.type} → P&L: $${pnl.toFixed(2)} (${(pnl/balance*100).toFixed(2)}%)`);
                position = null;
            }
            
            updateStats();
        }

        function updateStats() {
            document.getElementById('balance').textContent = `$${balance.toFixed(2)}`;
            document.getElementById('equity').textContent = `$${equity.toFixed(2)}`;
            document.getElementById('pnl').textContent = `${((balance-10000)/100)*100 >= 0 ? '+' : ''}${(balance/100).toFixed(2)}%`;
            document.getElementById('winrate').textContent = trades > 0 ? `${((wins/trades)*100).toFixed(1)}%` : '0%';
            document.getElementById('wins').textContent = wins;
            document.getElementById('losses').textContent = losses;
            document.getElementById('trades').textContent = trades;
        }

        function logTrade(message) {
            const log = document.getElementById('log');
            log.innerHTML += `<div>${new Date().toLocaleTimeString()}: ${message}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        let botInterval;
        function startBot() {
            if (botRunning) return;
            botRunning = true;
            document.querySelector('button[onclick="startBot()"]').disabled = true;
            
            updatePrice();
            botInterval = setInterval(() => {
                updatePrice();
                if (botRunning && generateSignal() !== 'HOLD' && !position) {
                    executeTrade(generateSignal());
                }
            }, 2000);
            
            logTrade('🤖 Bot Started - RSI + MA Strategy Active');
        }

        function stopBot() {
            botRunning = false;
            clearInterval(botInterval);
            document.querySelector('button[onclick="startBot()"]').disabled = false;
            logTrade('⏹️ Bot Stopped');
        }

        function placeTrade(type) {
            executeTrade(type);
        }

        function resetBot() {
            if (confirm('Reset all data?')) {
                balance = 10000;
                equity = 10000;
                position = null;
                trades = wins = losses = 0;
                priceHistory = [];
                currentPrice = 2450.23;
                document.getElementById('log').innerHTML = '';
                updateStats();
                stopBot();
                logTrade('🔄 Bot Reset');
            }
        }

        updateStats();
    </script>
</body>
</html>
